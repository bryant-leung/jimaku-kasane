<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="JimakuKasane 字幕重ね">
  <title>JimakuKasane 字幕重ね</title>
  <rect width="128" height="128" rx="28" fill="#1d1b2f"/>
  <!-- back card: the English line -->
  <rect x="30" y="20" width="78" height="54" rx="12" fill="#7c86c9"/>
  <rect x="42" y="34" width="44" height="7" rx="3.5" fill="#1d1b2f" opacity="0.55"/>
  <rect x="42" y="48" width="30" height="7" rx="3.5" fill="#1d1b2f" opacity="0.55"/>
  <!-- front card: the Japanese line, layered on top -->
  <rect x="18" y="50" width="78" height="58" rx="12" fill="#fbf7ef" stroke="#1d1b2f" stroke-width="4"/>
  <text x="57" y="96" text-anchor="middle" font-family="Hiragino Mincho ProN, Hiragino Sans, Noto Serif JP, serif"
        font-size="44" font-weight="700" fill="#d7263d">字</text>
</svg>
