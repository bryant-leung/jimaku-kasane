[project]
name = "jpsub-server"
version = "0.1.0"
description = "Local Whisper + LangGraph service: Japanese subtitles for episodes nobody has uploaded yet."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pydantic-settings>=2.6",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
